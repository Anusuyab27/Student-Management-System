<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div th:replace="menu :: menuFr"></div>
<div>
    <h2>Student List</h2>
</div>
<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Semester</th>
    </tr>
    <tr th:each="student:${students}">
        <td th:text="${student.id}"></td>
        <td th:text="${student.name}"></td>
        <td th:text="${student.sem}"></td>
    </tr>
</table>
</body>
</html>
